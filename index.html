<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>शुभ विवाह — निमंत्रण</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body class="envelope-body">

  <div class="mandala-bg" aria-hidden="true">
    <svg class="mandala-svg mandala-tl" viewBox="0 0 200 200"><use href="#mandalaMotif"></use></svg>
    <svg class="mandala-svg mandala-br" viewBox="0 0 200 200"><use href="#mandalaMotif"></use></svg>
  </div>

  <div class="gold-particles" id="goldParticles" aria-hidden="true"></div>

  <!-- साझा SVG मंडला मोटिफ़ -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <g id="mandalaMotif">
        <circle cx="100" cy="100" r="90" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>
        <circle cx="100" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>
        <g opacity="0.55">
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(30 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(60 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(90 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(120 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(150 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(180 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(210 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(240 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(270 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(300 100 100)"/>
          <path d="M100 20 C110 45 110 55 100 70 C90 55 90 45 100 20 Z" fill="currentColor" transform="rotate(330 100 100)"/>
        </g>
        <circle cx="100" cy="100" r="10" fill="currentColor" opacity="0.6"/>
      </g>
    </defs>
  </svg>

  <main class="envelope-stage">
    <p class="eyebrow">॥ श्री गणेशाय नमः ॥</p>

    <div class="envelope-wrap" id="envelopeWrap" tabindex="0" role="button" aria-label="निमंत्रण खोलने के लिए क्लिक करें">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="envelope-front"></div>
        <div class="envelope-flap" id="envelopeFlap"></div>
        <div class="envelope-seal" id="envelopeSeal">
          <span>शुभ<br/>विवाह</span>
        </div>
        <div class="envelope-card" id="envelopeCard">
          <div class="card-inner">
            <p class="card-om">卐</p>
            <p class="card-line">दो दिल, दो जोड़े</p>
            <p class="card-line small">एक नई शुरुआत</p>
          </div>
        </div>
      </div>
    </div>

    <button class="open-btn" id="openBtn" data-click-sound>निमंत्रण खोलें</button>
    <p class="hint-text">पूरा अनुभव लेने के लिए ध्वनि चालू रखें 🔊</p>
  </main>

  <div class="fade-overlay" id="fadeOverlay" aria-hidden="true"></div>

  <script src="script.js"></script>
  <script>
    const envelopeWrap = document.getElementById('envelopeWrap');
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('openBtn');
    const fadeOverlay = document.getElementById('fadeOverlay');
    let opening = false;

    function spawnParticles() {
      const holder = document.getElementById('goldParticles');
      for (let i = 0; i < 26; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDelay = (Math.random() * 6) + 's';
        p.style.animationDuration = (5 + Math.random() * 5) + 's';
        p.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
        holder.appendChild(p);
      }
    }
    spawnParticles();

    function openInvitation() {
      if (opening) return;
      opening = true;

      // पहला क्लिक = उपयोगकर्ता इंटरैक्शन, इसलिए संगीत यहीं शुरू करें
      SoundSystem.envelope();
      SoundSystem.startMusic();

      envelope.classList.add('is-opening');
      openBtn.disabled = true;

      // सील और फ्लैप खुलने के बाद कार्ड ऊपर उठे
      setTimeout(() => {
        envelope.classList.add('card-out');
      }, 650);

      // अंत में अगले पेज पर जाएँ
      setTimeout(() => {
        fadeOverlay.classList.add('active');
      }, 1900);

      setTimeout(() => {
        window.location.href = 'intro.html';
      }, 2500);
    }

    envelopeWrap.addEventListener('click', openInvitation);
    envelopeWrap.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvitation(); }
    });
    openBtn.addEventListener('click', openInvitation);
  </script>
</body>
</html>
