<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>शुभ विवाह — यात्रा</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="intro.css" />
</head>
<body class="intro-body">

  <div class="gold-particles" id="goldParticles" aria-hidden="true"></div>

  <section class="scene" id="scene">

    <!-- आकाश और पृष्ठभूमि (parallax) -->
    <div class="sky"></div>
    <svg class="skyline" id="skyline" viewBox="0 0 800 200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,200 L0,140 L40,140 L40,110 Q60,95 80,110 L80,140 L140,140 L140,90 L160,90 L160,70 Q170,55 180,70 L180,90 L200,90 L200,140 L260,140 L260,120 L300,120 L300,140 L360,140 L360,100 L380,100 L380,80 Q390,68 400,80 L400,100 L420,100 L420,140 L480,140 L480,115 L520,115 L520,140 L580,140 L580,95 L600,95 L600,75 Q610,60 620,75 L620,95 L640,95 L640,140 L700,140 L700,125 L740,125 L740,140 L800,140 L800,200 Z" fill="var(--maroon-deep)" opacity="0.18"/>
    </svg>
    <div class="petals" id="petals" aria-hidden="true"></div>

    <p class="scene-eyebrow">॥ स्वागतम् ॥</p>
    <h1 class="scene-title">विवाह की शुभ यात्रा</h1>

    <!-- स्कूटर व दोनों जोड़े -->
    <div class="road">
      <div class="scooter-rig" id="scooterRig">

        <svg class="scooter-svg" viewBox="0 0 620 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bodyGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#C9A15A"/>
              <stop offset="100%" stop-color="#93732F"/>
            </linearGradient>
            <linearGradient id="sareeGrad" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#9C2A3A"/>
              <stop offset="100%" stop-color="#6E141F"/>
            </linearGradient>
            <linearGradient id="sherwaniGrad" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#5A1420"/>
              <stop offset="100%" stop-color="#3A0B12"/>
            </linearGradient>
          </defs>

          <!-- फूलों की सजावट -->
          <g class="flowers" fill="#E8CB86">
            <circle cx="70" cy="170" r="6"/><circle cx="82" cy="165" r="5"/><circle cx="60" cy="160" r="5"/>
            <circle cx="70" cy="170" r="2.4" fill="#7A1F2E"/>
          </g>
          <g class="flowers" fill="#C9647A">
            <circle cx="95" cy="175" r="5"/><circle cx="108" cy="168" r="4.5"/>
          </g>

          <!-- couple 2 (पीछे बैठा जोड़ा) -->
          <g class="rider back-rider" transform="translate(300,60)">
            <!-- दूल्हा 2 -->
            <g transform="translate(-8,10)">
              <circle cx="0" cy="0" r="17" fill="#E8B98C"/>
              <path d="M-17 -6 Q0 -30 17 -6 L17 4 Q0 -8 -17 4 Z" fill="#5A1420"/>
              <rect x="-13" y="15" width="26" height="46" rx="8" fill="url(#sherwaniGrad)"/>
              <rect x="-13" y="15" width="26" height="10" rx="4" fill="#C9A15A"/>
            </g>
            <!-- दुल्हन 2 -->
            <g transform="translate(20,14)">
              <circle cx="0" cy="0" r="16" fill="#E8B98C"/>
              <path d="M-16 -2 Q0 -22 16 -2 L14 20 Q0 8 -14 20 Z" fill="url(#sareeGrad)" opacity="0.92"/>
              <rect x="-12" y="14" width="24" height="42" rx="9" fill="url(#sareeGrad)"/>
              <circle cx="0" cy="-6" r="2" fill="#E8CB86"/>
            </g>
          </g>

          <!-- couple 1 (आगे बैठा जोड़ा, स्कूटर चलाते हुए) -->
          <g class="rider front-rider" transform="translate(230,90)">
            <!-- दूल्हा 1 (चालक) -->
            <g transform="translate(-6,8)">
              <circle cx="0" cy="0" r="18" fill="#E8B98C"/>
              <path d="M-18 -8 Q0 -32 18 -8 L18 5 Q0 -6 -18 5 Z" fill="#7A1F2E"/>
              <rect x="-6" y="-4" width="12" height="3" rx="1.5" fill="#C9A15A"/>
              <rect x="-14" y="16" width="28" height="48" rx="8" fill="url(#sherwaniGrad)"/>
              <rect x="-14" y="16" width="28" height="11" rx="4" fill="#C9A15A"/>
              <!-- हाथ हैंडल पर -->
              <rect class="arm" x="10" y="28" width="34" height="7" rx="3.5" fill="url(#sherwaniGrad)"/>
            </g>
            <!-- दुल्हन 1 -->
            <g transform="translate(24,12)">
              <circle cx="0" cy="0" r="17" fill="#E8B98C"/>
              <path d="M-17 -2 Q0 -24 17 -2 L15 22 Q0 9 -15 22 Z" fill="url(#sareeGrad)"/>
              <rect x="-13" y="15" width="26" height="45" rx="9" fill="url(#sareeGrad)"/>
              <circle cx="0" cy="-8" r="2.2" fill="#E8CB86"/>
              <path d="M-17 -2 Q-24 20 -10 40" fill="none" stroke="url(#sareeGrad)" stroke-width="8" stroke-linecap="round" class="dupatta"/>
            </g>
          </g>

          <!-- स्कूटर बॉडी -->
          <g class="scooter-body">
            <path d="M120 210 Q140 150 210 150 L340 150 Q400 150 420 190 L470 190 Q500 190 505 215 L505 235 L110 235 Q100 220 120 210 Z" fill="url(#bodyGrad)" stroke="#5A1420" stroke-width="2"/>
            <path d="M210 150 L215 110 Q220 95 240 95 L255 95 L250 150 Z" fill="#93732F"/>
            <rect x="238" y="60" width="8" height="38" rx="4" fill="#3B2416"/>
            <ellipse cx="242" cy="56" rx="18" ry="7" fill="#3B2416"/>
            <circle cx="480" cy="195" r="10" fill="#FBF3E7" stroke="#93732F" stroke-width="2"/>
            <rect x="150" y="185" width="70" height="14" rx="7" fill="#3B2416"/>
          </g>

          <!-- पहिए -->
          <g class="wheel front-wheel" transform-origin="480 245">
            <circle cx="480" cy="245" r="30" fill="#2A1A10" stroke="#C9A15A" stroke-width="3"/>
            <circle cx="480" cy="245" r="10" fill="#C9A15A"/>
            <g stroke="#C9A15A" stroke-width="2.5">
              <line x1="480" y1="220" x2="480" y2="270"/>
              <line x1="455" y1="245" x2="505" y2="245"/>
              <line x1="463" y1="228" x2="497" y2="262"/>
              <line x1="463" y1="262" x2="497" y2="228"/>
            </g>
          </g>
          <g class="wheel back-wheel" transform-origin="150 245">
            <circle cx="150" cy="245" r="30" fill="#2A1A10" stroke="#C9A15A" stroke-width="3"/>
            <circle cx="150" cy="245" r="10" fill="#C9A15A"/>
            <g stroke="#C9A15A" stroke-width="2.5">
              <line x1="150" y1="220" x2="150" y2="270"/>
              <line x1="125" y1="245" x2="175" y2="245"/>
              <line x1="133" y1="228" x2="167" y2="262"/>
              <line x1="133" y1="262" x2="167" y2="228"/>
            </g>
          </g>

          <!-- तोरण / फूल माला -->
          <path d="M120 130 Q245 90 470 130" fill="none" stroke="#7A1F2E" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.7"/>
        </svg>

        <div class="shadow-blob"></div>
      </div>
    </div>

    <p class="scene-message" id="sceneMessage">दो दिल, दो जोड़े और एक नई शुरुआत</p>

    <button class="continue-btn" id="continueBtn" data-click-sound>आगे बढ़ें</button>
  </section>

  <!-- लैंप / दीया पॉपअप -->
  <div class="lamp-modal" id="lampModal" aria-hidden="true">
    <div class="lamp-modal-inner">
      <p class="lamp-heading">निमंत्रण खोलने के लिए दीपक प्रज्वलित करें</p>

      <div class="lamp-stage" id="lampStage">
        <div class="lamp-ceiling"></div>
        <div class="lamp-rope-wrap" id="lampRopeWrap">
          <svg class="lamp-rope" id="lampRope" viewBox="0 0 20 160" preserveAspectRatio="none">
            <line x1="10" y1="0" x2="10" y2="160" stroke="#93732F" stroke-width="3"/>
          </svg>
          <div class="lamp-glow" id="lampGlow"></div>
          <svg class="lamp-diya" id="lampDiya" viewBox="0 0 100 90">
            <ellipse cx="50" cy="60" rx="42" ry="16" fill="#93732F"/>
            <path d="M10 55 Q50 85 90 55 L84 62 Q50 82 16 62 Z" fill="#7A5A24"/>
            <ellipse cx="50" cy="52" rx="38" ry="13" fill="#C9A15A"/>
            <ellipse cx="50" cy="50" rx="30" ry="9" fill="#E8CB86"/>
            <path id="flamePath" d="M50 42 Q56 30 50 16 Q44 30 50 42 Z" fill="#F4A93B" class="flame"/>
            <path d="M50 38 Q53 30 50 22 Q47 30 50 38 Z" fill="#FFE3A1" class="flame-inner"/>
          </svg>
        </div>
        <p class="lamp-instruction">दीपक को नीचे खींचें</p>
        <div class="lamp-progress-track"><div class="lamp-progress-fill" id="lampProgressFill"></div></div>
      </div>
    </div>
  </div>

  <div class="fade-overlay" id="fadeOverlay" aria-hidden="true"></div>

  <script src="script.js"></script>
  <script src="intro.js"></script>
</body>
</html>
